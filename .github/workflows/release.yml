name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build and attach release assets for (e.g. v0.1.1)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Git tag to build and attach release assets for"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "error: invalid release tag '$TAG' (expected vX.Y.Z)" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
      - run: pip install -r requirements-dev.txt
      - name: Verification (tests, syntax, sanitization)
        run: |
          python -m py_compile *.py fetch/*.py tests/*.py
          pytest -q
          node --check verify_decrypt.mjs
          scripts/check_sanitized.sh
      - name: Build demo site, source tarball, and checksums
        env:
          DIGEST_DEMO_PASSWORD: ${{ vars.DIGEST_DEMO_PASSWORD }}
        run: |
          python3 publish.py --demo --out dist/
          (cd dist && zip -qr "../ai-digest-demo-${TAG}.zip" .)
          git archive --format=tar.gz --prefix="ai-digest-${TAG}/" -o "ai-digest-${TAG}-source.tar.gz" "$TAG"
          sha256sum "ai-digest-${TAG}-source.tar.gz" "ai-digest-demo-${TAG}.zip" > SHA256SUMS.txt
      - name: Publish GitHub Release or upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=(
            "ai-digest-${TAG}-source.tar.gz"
            "ai-digest-demo-${TAG}.zip"
            "SHA256SUMS.txt"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            # Notes = the CHANGELOG.md section for this version (falls back to generated notes).
            ver="${TAG#v}"
            awk -v v="$ver" '/^###? / { p = index($0, "[" v "]") > 0 || index($0, " " v " ") > 0; next } /^\[[^]]*\]: / { next } p' CHANGELOG.md > release-notes.md
            if [ -s release-notes.md ]; then notes=(--notes-file release-notes.md); else notes=(--generate-notes); fi
            extra=()
            if [[ "$TAG" == *-* ]]; then extra=(--prerelease); fi
            gh release create "$TAG" \
              --title "$TAG" \
              "${extra[@]}" \
              "${notes[@]}" \
              "${assets[@]}"
          fi
