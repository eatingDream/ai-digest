name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build and attach release assets for (e.g. v1.0.0)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Git tag to build and attach release assets for"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag, tests & sanitization
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      AI_DIGEST_REQUIRE_WEB_DIST: "1"
    steps:
      - name: Validate tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "error: invalid release tag '$TAG' (expected vX.Y.Z)" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Verify frontend, Rust tests, tag version, and sanitization
        run: |
          npm --prefix web ci
          npm --prefix web run typecheck
          rm -rf web/dist
          npm --prefix web run build
          git diff --exit-code web/dist/
          npm --prefix web test
          cargo test --locked
          scripts/check_sanitized.sh
          ver="${TAG#v}"
          node_ver=$(node web/dist/verify_decrypt.mjs --version)
          if [ "$node_ver" != "ai-digest $ver" ]; then
            echo "error: tag '$TAG' does not match verify_decrypt.mjs version '$node_ver'" >&2
            exit 1
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            build_demo: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            build_demo: false
          - target: aarch64-apple-darwin
            os: macos-15-intel
            build_demo: false
          - target: x86_64-apple-darwin
            os: macos-15-intel
            build_demo: false
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      AI_DIGEST_REQUIRE_WEB_DIST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
      - name: Build release binary
        run: |
          RUSTFLAGS="--remap-path-prefix=$HOME=/build --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo --remap-path-prefix=$(pwd -P)=/src --remap-path-prefix=$PWD=/src" \
            cargo build --release --locked --target "${{ matrix.target }}"
      - name: Verify clean binary strings and native --version
        run: |
          bin="target/${{ matrix.target }}/release/ai-digest"
          if strings "$bin" | grep -Eq '(/Users/|/home/|/private/(tmp|var)/|C:\\Users\\)'; then
            echo "error: local path leaked into $bin" >&2
            strings "$bin" | grep -E '(/Users/|/home/|/private/(tmp|var)/|C:\\Users\\)' | head -n 20 >&2
            exit 1
          fi
          archive="ai-digest-${TAG}-${{ matrix.target }}.tar.gz"
          stage=$(mktemp -d)
          pkg_dir="$stage/ai-digest-${TAG}-${{ matrix.target }}"
          mkdir -p "$pkg_dir/fetch"
          cp "$bin" LICENSE README.md publish.sh "$pkg_dir/"
          cp fetch/sources.toml fetch/preferences.example.json "$pkg_dir/fetch/"
          cp -R examples "$pkg_dir/examples"
          chmod +x "$pkg_dir/ai-digest" "$pkg_dir/publish.sh"
          mkdir -p out-assets
          tar -czf "out-assets/$archive" -C "$stage" "ai-digest-${TAG}-${{ matrix.target }}"
          check_dir=$(mktemp -d)
          tar -xzf "out-assets/$archive" -C "$check_dir"
          unpacked="$check_dir/ai-digest-${TAG}-${{ matrix.target }}"
          host_arch=$(uname -m)
          if [ "${{ matrix.target }}" != "aarch64-apple-darwin" ] || [ "$host_arch" = "arm64" ]; then
            got=$("$unpacked/ai-digest" --version)
            want="ai-digest ${TAG#v}"
            if [ "$got" != "$want" ]; then
              echo "error: binary --version '$got' != expected '$want'" >&2
              exit 1
            fi
          else
            lipo -archs "$unpacked/ai-digest" | grep -qx "arm64"
          fi
          test -f "$unpacked/fetch/sources.toml"
          test -f "$unpacked/fetch/preferences.example.json"
          test -f "$unpacked/examples/sample-digest.en.md"
          if [ "${{ matrix.target }}" != "aarch64-apple-darwin" ] || [ "$host_arch" = "arm64" ]; then
            (cd "$check_dir" && "$unpacked/publish.sh" --demo --lang en --out "$check_dir/demo-smoke")
            test -f "$check_dir/demo-smoke/demo/index.html"
          fi
          rm -rf "$stage" "$check_dir"
      - name: Build demo zip
        if: matrix.build_demo
        env:
          DIGEST_DEMO_PASSWORD: ${{ vars.DIGEST_DEMO_PASSWORD }}
        run: |
          "./target/${{ matrix.target }}/release/ai-digest" publish --demo --out dist/
          (cd dist && zip -qr "../out-assets/ai-digest-demo-${TAG}.zip" .)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-assets-${{ matrix.target }}
          path: out-assets/*
          retention-days: 1

  publish:
    name: Checksums & upload release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true
      - name: Build source tarball and SHA256SUMS.txt
        run: |
          git archive --format=tar.gz --prefix="ai-digest-${TAG}/" -o "release-assets/ai-digest-${TAG}-source.tar.gz" "$TAG"
          (
            cd release-assets
            sha256sum \
              "ai-digest-${TAG}-x86_64-unknown-linux-gnu.tar.gz" \
              "ai-digest-${TAG}-aarch64-unknown-linux-gnu.tar.gz" \
              "ai-digest-${TAG}-aarch64-apple-darwin.tar.gz" \
              "ai-digest-${TAG}-x86_64-apple-darwin.tar.gz" \
              "ai-digest-demo-${TAG}.zip" \
              "ai-digest-${TAG}-source.tar.gz" \
              > SHA256SUMS.txt
          )
          cat release-assets/SHA256SUMS.txt
      - name: Publish GitHub Release or upload assets
        run: |
          assets=(
            "release-assets/ai-digest-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
            "release-assets/ai-digest-${TAG}-aarch64-unknown-linux-gnu.tar.gz"
            "release-assets/ai-digest-${TAG}-aarch64-apple-darwin.tar.gz"
            "release-assets/ai-digest-${TAG}-x86_64-apple-darwin.tar.gz"
            "release-assets/ai-digest-demo-${TAG}.zip"
            "release-assets/ai-digest-${TAG}-source.tar.gz"
            "release-assets/SHA256SUMS.txt"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            ver="${TAG#v}"
            awk -v v="$ver" '/^###? / { p = index($0, "[" v "]") > 0 || index($0, " " v " ") > 0; next } /^\[[^]]*\]: / { next } p' CHANGELOG.md > release-notes.md
            if [ -s release-notes.md ]; then notes=(--notes-file release-notes.md); else notes=(--generate-notes); fi
            extra=()
            if [[ "$TAG" == *-* ]]; then extra=(--prerelease); fi
            gh release create "$TAG" \
              --title "$TAG" \
              "${extra[@]}" \
              "${notes[@]}" \
              "${assets[@]}"
          fi
