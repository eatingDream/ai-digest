name: Demo site

on:
  push:
    branches: [main]
    paths:
      - src/**
      - web/**
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - examples/**
      - site/**
      - .github/workflows/demo.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-pages
  cancel-in-progress: true

jobs:
  demo:
    runs-on: ubuntu-latest
    env:
      AI_DIGEST_REQUIRE_WEB_DIST: "1"
      # Public demo by default; set repo var DIGEST_DEMO_PASSWORD to build an encrypted demo.
      DIGEST_DEMO_PASSWORD: ${{ vars.DIGEST_DEMO_PASSWORD }}
      CF_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'ai-digest-demo' }}
      SITE_DOMAIN: ${{ vars.DEMO_SITE_DOMAIN || 'ai-digest-demo.pages.dev' }}
      HAS_CF_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build ai-digest release binary
        run: cargo build --release --locked
      - name: Build demo site (no deploy)
        run: ./target/release/ai-digest publish --demo --out dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: demo-dist
          path: dist
          retention-days: 7
      - name: Ensure Pages project exists
        if: env.HAS_CF_SECRETS == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ env.CF_PROJECT }} --production-branch=main
      - name: Deploy to Cloudflare Pages
        if: env.HAS_CF_SECRETS == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.CF_PROJECT }} --branch=main
      - name: Deploy skipped
        if: env.HAS_CF_SECRETS != 'true'
        run: echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; demo built and uploaded as an artifact only."
