name: Demo site

on:
  push:
    branches: [main]
    paths:
      - render_html.py
      - publish.py
      - i18n.py
      - examples/**
      - site/**
      - .github/workflows/demo.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-pages
  cancel-in-progress: true

jobs:
  demo:
    runs-on: ubuntu-latest
    env:
      # The demo password is public demo data (it is shown in the README), not a secret.
      DIGEST_DEMO_PASSWORD: ${{ vars.DIGEST_DEMO_PASSWORD || 'demo' }}
      CF_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'ai-digest-demo' }}
      HAS_CF_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Build demo site (no deploy)
        run: python3 publish.py --demo --out dist/
      - uses: actions/upload-artifact@v7
        with:
          name: demo-dist
          path: dist
          retention-days: 7
      - name: Ensure Pages project exists
        if: env.HAS_CF_SECRETS == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ env.CF_PROJECT }} --production-branch=main
      - name: Deploy to Cloudflare Pages
        if: env.HAS_CF_SECRETS == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.CF_PROJECT }} --branch=main
      - name: Deploy skipped
        if: env.HAS_CF_SECRETS != 'true'
        run: echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; demo built and uploaded as an artifact only."
