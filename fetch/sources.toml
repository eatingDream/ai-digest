# AI精选 信源注册表（ai-digest fetch 读取）
# 每个 [[source]] 一条。字段：
#   id        唯一 id（报告与 candidates.jsonl 的 source 字段）
#   name      显示名
#   type      rss | html_links | arxiv | hf_daily | hf_org_models | hf_trending | github_trending
#             | github_releases | github_org_repos | github_search | hn | reddit
#   url       抓取入口
#   channel   大类（lab / research_blog / newsletter / podcast / news / news_zh / chips_infra
#             / policy / community / tooling / paper / model / repo）
#   kind      条目类型默认值（paper / model / repo / release / lab_post / essay / news / policy / podcast / video / discussion / dataset）
#   filter    "ai" = 只保留标题/摘要命中 AI 关键词的条目（综合新闻源用）
#   pattern   html_links 用：保留的 href 正则（相对或绝对）
#   enabled   false 则跳过
# 死链与停更源在文件末尾注释里记录，不要直接删掉记录。

[settings]
timeout = 20
workers = 24
user_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36"
summary_chars = 700

# ───────────────────────── 论文 ─────────────────────────
[[source]]
id = "arxiv"
name = "arXiv new listings"
type = "arxiv"
channel = "paper"
kind = "paper"
categories = ["cs.LG", "cs.CL", "cs.AI", "cs.CV", "cs.MA", "cs.SE", "cs.RO", "stat.ML", "cs.CR", "cs.DC", "cs.HC", "cs.IR"]
# cs.CR(安全)、cs.DC(分布式/训练系统)、cs.HC(人机/产品)、cs.IR(检索) 是扩充后的新范围

[[source]]
id = "hf_daily"
name = "Hugging Face Daily Papers"
type = "hf_daily"
url = "https://huggingface.co/api/daily_papers"
channel = "paper"
kind = "paper"

[[source]]
id = "nature_ml"
name = "Nature · Machine learning"
type = "rss"
url = "https://www.nature.com/subjects/machine-learning.rss"
channel = "paper"
kind = "paper"

[[source]]
id = "science"
name = "Science (AI 相关)"
type = "rss"
url = "https://www.science.org/action/showFeed?type=etoc&feed=rss&jc=science"
channel = "paper"
kind = "paper"
filter = "ai"

