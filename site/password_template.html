<!DOCTYPE html>
<html lang="{{html_lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#faf8f4">
<title>{{pw_title}}</title>
<script>
(function () {
  try {
    var t = localStorage.getItem("digest-theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    var dk = t === "dark" || (t !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", dk ? "#141311" : "#faf8f4");
  } catch (e) {}
})();
</script>
<style>
:root {
  --bg: #faf8f4;
  --surface: #ffffff;
  --ink: #1f1c18;
  --ink-3: #635a4f;
  --line: #e4ddd2;
  --accent: #b85432;
  --accent-ink: #9c4223;
  --accent-contrast: #ffffff;
  --hot: #c23b2b;
  --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
    "PingFang SC", "Hiragino Sans GB", "HarmonyOS Sans SC", "Microsoft YaHei",
    "Noto Sans CJK SC", "Noto Sans CJK TC", "Noto Sans", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141311;
    --surface: #1f1d19;
    --ink: #efeae2;
    --ink-3: #a89f92;
    --line: rgba(239, 234, 226, 0.12);
    --accent: #df7d56;
    --accent-ink: #ec9672;
    --accent-contrast: #161310;
    --hot: #e3725b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141311;
  --surface: #1f1d19;
  --ink: #efeae2;
  --ink-3: #a89f92;
  --line: rgba(239, 234, 226, 0.12);
  --accent: #df7d56;
  --accent-ink: #ec9672;
  --accent-contrast: #161310;
  --hot: #e3725b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
}
body {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
}
#box { width: min(360px, calc(100% - 40px)); }
h1 {
  font-size: 22px;
  font-weight: 650;
  letter-spacing: 0.08em;
  margin: 0 0 28px;
  text-align: center;
}
h1 .ai { color: var(--accent); }
form { display: flex; flex-direction: column; gap: 10px; }
label.pw-lab {
  font-size: 13px;
  color: var(--ink-3);
  letter-spacing: 0.06em;
}
input[type="password"] {
  width: 100%;
  font-size: 16px;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--surface);
  color: var(--ink);
  outline: none;
}
input[type="password"]:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
}
.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 6px;
}
label.rem {
  font-size: 13px;
  color: var(--ink-3);
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  user-select: none;
}
label.rem input { accent-color: var(--accent); }
@keyframes btnSpin { to { transform: rotate(360deg); } }
@keyframes boxShake {
  0%, 100% { transform: translateX(0); }
  22% { transform: translateX(-6px); }
  48% { transform: translateX(6px); }
  74% { transform: translateX(-4px); }
}
button {
  position: relative;
  overflow: hidden;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  appearance: none;
  border: 0;
  background: var(--accent);
  color: var(--accent-contrast);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.08em;
  padding: 11px 22px;
  border-radius: 999px;
  cursor: pointer;
  font-family: inherit;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 4px 14px color-mix(in srgb, var(--accent) 26%, transparent);
  transition: transform 280ms cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 200ms ease, opacity 160ms ease;
}
button::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(115deg, transparent 22%, rgba(255, 255, 255, 0.26) 50%, transparent 78%);
  transform: translateX(-130%);
  transition: transform 520ms cubic-bezier(0.22, 1, 0.36, 1);
  pointer-events: none;
}
button:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.32), 0 8px 20px color-mix(in srgb, var(--accent) 34%, transparent);
}
button:hover:not(:disabled)::after { transform: translateX(130%); }
button:active:not(:disabled) { transform: translateY(0) scale(0.95); transition-duration: 90ms; }
button:disabled { opacity: 0.78; cursor: wait; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button .spin {
  display: none;
  width: 14px;
  height: 14px;
  border: 2px solid currentColor;
  border-right-color: transparent;
  border-radius: 50%;
  animation: btnSpin 720ms linear infinite;
}
button.is-loading .spin { display: inline-block; }
#box.is-shake { animation: boxShake 340ms ease; }
@media (prefers-reduced-motion: reduce) {
  button, button::after, button .spin, #box.is-shake { transition: none !important; animation: none !important; }
}
#err {
  color: var(--hot);
  font-size: 13px;
  margin: 10px 0 0;
  text-align: center;
  min-height: 1.2em;
}
.demo-hint { margin: 18px 0 0; text-align: center; font-size: 13px; color: var(--ink-3); }
.demo-hint code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--accent-ink); }
.lang-alt { display: block; margin: 22px auto 0; text-align: center; font-size: 13px; color: var(--ink-3); text-decoration: none; letter-spacing: 0.04em; }
.lang-alt:hover { color: var(--accent-ink); text-decoration: underline; text-underline-offset: 3px; }
noscript p { text-align: center; color: var(--ink-3); font-size: 14px; }
</style>
</head>
<body>
<noscript><p>{{pw_noscript}}</p></noscript>
<div id="box" hidden>
  <h1><span class="ai">AI</span>{{brand_tail}}</h1>
  <form id="f" autocomplete="off">
    <label class="pw-lab" for="pw">{{pw_label}}</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
    <div class="row">
      <label class="rem"><input id="rm" type="checkbox" checked> {{pw_remember}}</label>
      <button id="go" type="submit"><span class="spin" aria-hidden="true"></span><span class="go-t">{{pw_open}}</span></button>
    </div>
    <p id="err" hidden>{{pw_wrong}}</p>
  </form>
  {{demo_hint}}
  {{lang_switch}}
</div>
<script type="application/json" id="c">__ENCRYPT_CFG_JSON__</script>
<script>
(function () {
  "use strict";
  var STORE = "aie.k";
  var CFG;
  try {
    CFG = JSON.parse(document.getElementById("c").textContent);
  } catch (e) {
    showForm({{js:pw_unsupported}});
    return;
  }

  function b64ToBytes(s) {
    var bin = atob(s);
    var u = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u;
  }
  function bytesToB64(u) {
    var s = "", i, chunk = 0x8000;
    for (i = 0; i < u.length; i += chunk) {
      s += String.fromCharCode.apply(null, u.subarray(i, i + chunk));
    }
    return btoa(s);
  }
  function showForm(msg) {
    var box = document.getElementById("box");
    var err = document.getElementById("err");
    box.hidden = false;
    if (msg) {
      err.textContent = msg;
      err.hidden = false;
    }
    var pw = document.getElementById("pw");
    if (pw) pw.focus();
  }
  function scrollToHash(h) {
    if (!h || h.length < 2) return;
    var raw = h.slice(1), id = raw;
    try { id = decodeURIComponent(raw); } catch (e) {}
    var el = document.getElementById(id) || document.getElementsByName(id)[0];
    if (el && el.scrollIntoView) el.scrollIntoView();
  }
  function openPage(html) {
    var hash = location.hash;
    document.open("text/html");
    document.write(html);
    document.close();
    if (hash && location.hash !== hash) {
      try { history.replaceState(null, "", hash); } catch (e) {}
    }
    scrollToHash(hash);
    if (typeof requestAnimationFrame === "function") {
      requestAnimationFrame(function () { scrollToHash(hash); });
    }
  }
  function loadStored() {
    var stores = [];
    try { stores.push(sessionStorage); } catch (e) {}
    try { stores.push(localStorage); } catch (e) {}
    for (var i = 0; i < stores.length; i++) {
      try {
        var raw = stores[i].getItem(STORE);
        if (!raw) continue;
        var rec = JSON.parse(raw);
        if (rec && rec.v === 1 && rec.salt === CFG.salt && rec.key) return rec;
      } catch (e) {}
    }
    return null;
  }
  function saveKey(keyBytes, remember) {
    var rec = JSON.stringify({ v: 1, salt: CFG.salt, key: bytesToB64(keyBytes) });
    try { sessionStorage.setItem(STORE, rec); } catch (e) {}
    try {
      if (remember) localStorage.setItem(STORE, rec);
      else localStorage.removeItem(STORE);
    } catch (e) {}
  }
  function clearStored() {
    try { sessionStorage.removeItem(STORE); } catch (e) {}
    try { localStorage.removeItem(STORE); } catch (e) {}
  }
  async function decryptWithKey(keyBytes) {
    var key = await crypto.subtle.importKey("raw", keyBytes, "AES-GCM", false, ["decrypt"]);
    var iv = b64ToBytes(CFG.iv);
    var ct = b64ToBytes(CFG.ct);
    var pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ct);
    if (CFG.z) {
      // v2: plaintext was gzip-compressed before encryption.
      var s = new Blob([pt]).stream().pipeThrough(new DecompressionStream(CFG.z));
      pt = await new Response(s).arrayBuffer();
    }
    return new TextDecoder("utf-8").decode(pt);
  }
  async function derive(password) {
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey(
      "raw",
      enc.encode(password),
      "PBKDF2",
      false,
      ["deriveBits"]
    );
    var bits = await crypto.subtle.deriveBits(
      { name: "PBKDF2", salt: b64ToBytes(CFG.salt), iterations: CFG.iter, hash: "SHA-256" },
      base,
      256
    );
    return new Uint8Array(bits);
  }
  async function tryStored() {
    var rec = loadStored();
    if (!rec) return false;
    try {
      var html = await decryptWithKey(b64ToBytes(rec.key));
      openPage(html);
      return true;
    } catch (e) {
      clearStored();
      return false;
    }
  }

  if (!window.crypto || !crypto.subtle || (CFG.z && typeof DecompressionStream === "undefined")) {
    showForm({{js:pw_unsupported}});
    return;
  }

  var form = document.getElementById("f");
  var boxEl = document.getElementById("box");
  var pw = document.getElementById("pw");
  var rm = document.getElementById("rm");
  var go = document.getElementById("go");
  var goT = go && go.querySelector(".go-t");
  var err = document.getElementById("err");
  var txtOpen = {{js:pw_open}};
  var txtOpening = {{js:pw_opening}};

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    err.hidden = true;
    go.disabled = true;
    go.classList.add("is-loading");
    if (goT) goT.textContent = txtOpening;
    try {
      var key = await derive(pw.value);
      var html = await decryptWithKey(key);
      saveKey(key, rm.checked);
      openPage(html);
    } catch (ex) {
      err.textContent = {{js:pw_wrong}};
      err.hidden = false;
      go.disabled = false;
      go.classList.remove("is-loading");
      if (goT) goT.textContent = txtOpen;
      if (boxEl) {
        boxEl.classList.remove("is-shake");
        void boxEl.offsetWidth;
        boxEl.classList.add("is-shake");
      }
      pw.focus();
      pw.select();
    }
  });

  tryStored().then(function (ok) {
    if (!ok) showForm();
  }).catch(function () {
    showForm();
  });
})();
</script>
</body>
</html>
