  <text x="488" y="165" font-size="11" fill="#4A5568">ai-digest page（防 SSRF）</text>
  <text x="488" y="181" font-size="10.5" fill="#64748B">遵循 filter-notes 选材标准</text>

  <g filter="url(#sh)"><rect x="474" y="208" width="170" height="86" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="474" y="208" width="4.5" height="86" rx="2.2" fill="#3B82F6"/></g>
  <text x="488" y="231" font-size="13" font-weight="650" fill="#0F1420">七大固定版面</text>
  <text x="488" y="249" font-size="11" fill="#4A5568">模型 · 论文 · 工具与项目</text>
  <text x="488" y="265" font-size="11" fill="#4A5568">行业 · 算力基建 · 安全政策</text>
  <text x="488" y="281" font-size="10.5" fill="#64748B">观点长文 · 只看内容分量</text>

  <g filter="url(#sh)"><rect x="474" y="308" width="170" height="90" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="474" y="308" width="4.5" height="90" rx="2.2" fill="#10B981"/></g>
