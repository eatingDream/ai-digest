  <g filter="url(#sh)"><rect x="694" y="212" width="182" height="86" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="694" y="212" width="4.5" height="86" rx="2.2" fill="#10B981"/></g>
