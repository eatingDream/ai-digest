  <g filter="url(#sh)"><rect x="694" y="108" width="182" height="92" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="694" y="108" width="4.5" height="92" rx="2.2" fill="#2952CC"/></g>
  <text x="708" y="131" font-size="13" font-weight="650" fill="#0F1420">ai-digest render + web/</text>
  <text x="708" y="149" font-size="11" fill="#4A5568">配置驱动静夜靛蓝阅读器</text>
  <text x="708" y="165" font-size="11" fill="#4A5568">52px 顶栏 · 手风琴侧栏目录</text>
