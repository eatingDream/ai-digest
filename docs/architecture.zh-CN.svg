  <rect x="242" y="66" width="194" height="346" rx="14" fill="#EEF2F8" stroke="#DCE4F2"/>
  <text x="339" y="92" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1E40AF">2 · 召回与初筛</text>

  <g filter="url(#sh)"><rect x="254" y="108" width="170" height="78" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="254" y="108" width="4.5" height="78" rx="2.2" fill="#2952CC"/></g>
  <text x="268" y="131" font-size="13" font-weight="650" fill="#0F1420">ai-digest fetch</text>
  <text x="268" y="149" font-size="11" fill="#4A5568">Tokio + rustls 异步并发</text>
  <text x="268" y="165" font-size="11" fill="#4A5568">自然日窗口 + 缺批重试</text>
  <text x="268" y="180" font-size="10.5" fill="#64748B">自动剥离点赞/星标噪音</text>

  <g filter="url(#sh)"><rect x="254" y="200" width="170" height="78" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="254" y="200" width="4.5" height="78" rx="2.2" fill="#3B82F6"/></g>
  <text x="268" y="223" font-size="13" font-weight="650" fill="#0F1420">去重与历史账本</text>
  <text x="268" y="241" font-size="11" fill="#4A5568">ai-digest ledger 追踪</text>
