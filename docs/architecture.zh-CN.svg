  <text x="708" y="253" font-size="11" fill="#4A5568">对称 /zh/ 与 /en/ 双语树</text>
  <text x="708" y="269" font-size="11" fill="#4A5568">llms.txt · .md · _worker.js</text>
  <text x="708" y="285" font-size="10.5" fill="#64748B">默认公开根路径（ENCRYPT=0）</text>

  <g filter="url(#sh)"><rect x="694" y="310" width="182" height="88" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="694" y="310" width="4.5" height="88" rx="2.2" fill="#DC2626"/></g>
  <text x="708" y="333" font-size="13" font-weight="650" fill="#0F1420">纵深安全门控</text>
  <text x="708" y="351" font-size="11" fill="#4A5568">构建期 SHA-256 哈希锁定 CSP</text>
  <text x="708" y="367" font-size="11" fill="#4A5568">HTML5 实体解码隐私扫描</text>
  <text x="708" y="383" font-size="10.5" fill="#64748B">按需开启 AES-256-GCM + SLUG</text>

