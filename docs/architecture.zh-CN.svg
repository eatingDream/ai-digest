  <g filter="url(#sh)"><rect x="254" y="292" width="170" height="106" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="254" y="292" width="4.5" height="106" rx="2.2" fill="#64748B"/></g>
  <text x="268" y="315" font-size="13" font-weight="650" fill="#0F1420">候选短名单产物</text>
  <text x="268" y="333" font-size="11" fill="#4A5568">• triage.md（按频道分组）</text>
  <text x="268" y="349" font-size="11" fill="#4A5568">• triage-papers.md（分层）</text>
  <text x="268" y="365" font-size="11" fill="#4A5568">• candidates.jsonl（cand）</text>
  <text x="268" y="381" font-size="11" fill="#4A5568">• x-leads.md（xparse）</text>

  <!-- Stage 3: LLM Curation -->
  <rect x="462" y="66" width="194" height="346" rx="14" fill="#F1F5FB" stroke="#DCE4F2"/>
  <text x="559" y="92" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1E40AF">3 · LLM 内容精选</text>

  <g filter="url(#sh)"><rect x="474" y="108" width="170" height="86" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="474" y="108" width="4.5" height="86" rx="2.2" fill="#2952CC"/></g>
  <text x="488" y="131" font-size="13" font-weight="650" fill="#0F1420">一手出处核验</text>
