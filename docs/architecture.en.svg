<title id="t">ai-digest architecture</title><desc id="d">Sources feed a fetch and triage stage, then LLM curation produces a Markdown digest, which is rendered, published (with optional AES-256-GCM encryption) and deployed to Cloudflare Pages. A scheduler drives the pipeline and GitHub Actions provides CI, release and demo deploy.</desc>
