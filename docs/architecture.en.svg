<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" role="img" aria-labelledby="t d" font-family="-apple-system,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title id="t">AI Digest architecture</title>
  <desc id="d">Open feeds and optional safe X recall feed the Rust ai-digest binary for parallel async fetch and triage, LLM curation produces bilingual Markdown digests, ai-digest render and publish embed TypeScript/CSS editorial assets into a hardened GEO-ready static site with hash-locked CSP and optional AES-256-GCM encryption, deployed to Cloudflare Pages and verified end-to-end.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#b85432"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8b7e72"/></marker>
    <filter id="sh" x="-4%" y="-6%" width="108%" height="118%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#2a241e" flood-opacity=".08"/></filter>
  </defs>

  <!-- Warm paper canvas -->
  <rect x="0.5" y="0.5" width="1119" height="619" rx="18" fill="#faf8f4" stroke="#e4ddd2"/>

  <!-- Brand emblem + title -->
  <g transform="translate(24,18)">
    <rect width="30" height="30" rx="8" fill="#b85432"/>
    <path d="M15 6.2 8.7 23.4h3.2l1.3-3.8h3.6l1.3 3.8h3.2L15 6.2Zm-1 10.6 1-3.3 1 3.3h-2Z" fill="#faf8f4"/>
    <circle cx="22.8" cy="7.8" r="2.2" fill="#f3c6a5"/>
  </g>
  <text x="64" y="39" font-size="18" font-weight="700" fill="#1f1c18">AI Digest · Rust Binary &amp; TypeScript Editorial Architecture</text>
  <text x="1094" y="38" text-anchor="end" font-size="12" fill="#7c7267">Single Rust binary · Level 5/5 GEO · Optional AES-256-GCM</text>

  <!-- Stage 1: Sources -->
  <rect x="22" y="66" width="194" height="346" rx="14" fill="#f4efe6" stroke="#ded4c5"/>
  <text x="119" y="92" text-anchor="middle" font-size="13.5" font-weight="700" fill="#9f4222">1 · Sources</text>

  <g filter="url(#sh)"><rect x="34" y="108" width="170" height="64" rx="10" fill="#fffdf9" stroke="#e5ddd0"/><rect x="34" y="108" width="4.5" height="64" rx="2.2" fill="#b85432"/></g>
  <text x="48" y="131" font-size="13" font-weight="650" fill="#1f1c18">Open Feeds (~155)</text>
  <text x="48" y="148" font-size="11" fill="#645b51">RSS · Atom · HTML · Blogs</text>
  <text x="48" y="163" font-size="10.5" fill="#8b7e72">Zero API keys required</text>

  <g filter="url(#sh)"><rect x="34" y="182" width="170" height="64" rx="10" fill="#fffdf9" stroke="#e5ddd0"/><rect x="34" y="182" width="4.5" height="64" rx="2.2" fill="#c96b3b"/></g>
  <text x="48" y="205" font-size="13" font-weight="650" fill="#1f1c18">Research &amp; Code</text>
  <text x="48" y="222" font-size="11" fill="#645b51">arXiv (12 cats) · HF Daily</text>
  <text x="48" y="237" font-size="10.5" fill="#8b7e72">GitHub releases &amp; trending</text>

  <g filter="url(#sh)"><rect x="34" y="256" width="170" height="64" rx="10" fill="#fffdf9" stroke="#e5ddd0"/><rect x="34" y="256" width="4.5" height="64" rx="2.2" fill="#d98a4e"/></g>
  <text x="48" y="279" font-size="13" font-weight="650" fill="#1f1c18">Communities &amp; Media</text>
  <text x="48" y="296" font-size="11" fill="#645b51">HN · Reddit · Lobsters</text>
  <text x="48" y="311" font-size="10.5" fill="#8b7e72">Podcasts · YouTube · Policy</text>

  <g filter="url(#sh)"><rect x="34" y="330" width="170" height="68" rx="10" fill="#fffdf9" stroke="#d8c8b4" stroke-dasharray="4 3"/><rect x="34" y="330" width="4.5" height="68" rx="2.2" fill="#7c7267"/></g>
  <text x="48" y="352" font-size="13" font-weight="650" fill="#1f1c18">Optional Safe X Recall</text>
  <text x="48" y="369" font-size="10.5" fill="#645b51">Free: Web search / RSS bridges</text>
  <text x="48" y="384" font-size="10.5" fill="#645b51">Paid: xAI x_search / X API v2</text>

  <!-- Stage 2: Recall & Triage -->
  <rect x="242" y="66" width="194" height="346" rx="14" fill="#f2efe9" stroke="#ded4c5"/>
  <text x="339" y="92" text-anchor="middle" font-size="13.5" font-weight="700" fill="#874826">2 · Recall &amp; Triage</text>

  <g filter="url(#sh)"><rect x="254" y="108" width="170" height="78" rx="10" fill="#fffdf9" stroke="#e5ddd0"/><rect x="254" y="108" width="4.5" height="78" rx="2.2" fill="#b85432"/></g>
  <text x="268" y="131" font-size="13" font-weight="650" fill="#1f1c18">ai-digest fetch</text>
  <text x="268" y="149" font-size="11" fill="#645b51">Async Tokio + rustls HTTP</text>
  <text x="268" y="165" font-size="11" fill="#645b51">Window [start, end) + retry</text>
  <text x="268" y="180" font-size="10.5" fill="#8b7e72">Strips vanity metrics</text>

  <g filter="url(#sh)"><rect x="254" y="200" width="170" height="78" rx="10" fill="#fffdf9" stroke="#e5ddd0"/><rect x="254" y="200" width="4.5" height="78" rx="2.2" fill="#c96b3b"/></g>
  <text x="268" y="223" font-size="13" font-weight="650" fill="#1f1c18">Dedupe &amp; Ledger</text>
  <text x="268" y="241" font-size="11" fill="#645b51">ai-digest ledger history</text>
  <text x="268" y="257" font-size="11" fill="#645b51">★ pushed / ☆ seen markers</text>
  <text x="268" y="272" font-size="10.5" fill="#8b7e72">Re-include only on real news</text>

  <g filter="url(#sh)"><rect x="254" y="292" width="170" height="106" rx="10" fill="#fffdf9" stroke="#e5ddd0"/><rect x="254" y="292" width="4.5" height="106" rx="2.2" fill="#64748b"/></g>
  <text x="268" y="315" font-size="13" font-weight="650" fill="#1f1c18">Triage Artifacts</text>
  <text x="268" y="333" font-size="11" fill="#645b51">• triage.md (by channel)</text>
  <text x="268" y="349" font-size="11" fill="#645b51">• triage-papers.md (tiered)</text>
  <text x="268" y="365" font-size="11" fill="#645b51">• candidates.jsonl (cand)</text>
  <text x="268" y="381" font-size="11" fill="#645b51">• x-leads.md (xparse)</text>

  <!-- Stage 3: LLM Curation -->
