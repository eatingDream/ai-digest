  <text x="48" y="352" font-size="13" font-weight="650" fill="#0F1420">Optional Safe X Recall</text>
  <text x="48" y="369" font-size="10.5" fill="#4A5568">Free: Web search / RSS bridges</text>
  <text x="48" y="384" font-size="10.5" fill="#4A5568">Paid: xAI x_search / X API v2</text>

