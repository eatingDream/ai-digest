  <text x="708" y="235" font-size="13" font-weight="650" fill="#1f1c18">ai-digest publish &amp; GEO</text>
  <text x="708" y="253" font-size="11" fill="#645b51">Symmetric /zh/ &amp; /en/ routes</text>
  <text x="708" y="269" font-size="11" fill="#645b51">llms.txt · .md · _worker.js</text>
  <text x="708" y="285" font-size="10.5" fill="#8b7e72">Public root default (ENCRYPT=0)</text>

  <g filter="url(#sh)"><rect x="694" y="310" width="182" height="88" rx="10" fill="#fffdf9" stroke="#e5ddd0"/><rect x="694" y="310" width="4.5" height="88" rx="2.2" fill="#8a3b2c"/></g>
  <text x="708" y="333" font-size="13" font-weight="650" fill="#1f1c18">Defense-in-Depth Gate</text>
  <text x="708" y="351" font-size="11" fill="#645b51">SHA-256 hash-locked CSP</text>
  <text x="708" y="367" font-size="11" fill="#645b51">HTML5 entity privacy scan</text>
  <text x="708" y="383" font-size="10.5" fill="#8b7e72">Opt-in AES-256-GCM + SLUG</text>

