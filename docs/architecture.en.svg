  <rect x="682" y="66" width="206" height="346" rx="14" fill="#EEF2F8" stroke="#DCE4F2"/>
  <text x="785" y="92" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1E40AF">4 · Render &amp; Harden</text>

