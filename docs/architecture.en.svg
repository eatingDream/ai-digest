<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" role="img" aria-labelledby="t d" font-family="-apple-system,'SF Pro Text','PingFang SC','Noto Sans CJK SC',BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif">
  <title id="t">AI Digest architecture</title>
  <desc id="d">Open feeds and optional safe X recall feed the Rust ai-digest binary for parallel async fetch and triage, LLM curation produces bilingual Markdown digests, ai-digest render and publish embed Lucid Indigo TypeScript/CSS editorial assets into a hardened GEO-ready static site with hash-locked CSP and optional AES-256-GCM encryption, deployed to Cloudflare Pages and verified end-to-end.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2952CC"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#64748B"/></marker>
    <filter id="sh" x="-4%" y="-6%" width="108%" height="118%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0F1420" flood-opacity=".06"/></filter>
  </defs>

  <!-- Lucid Indigo light slate canvas -->
  <rect x="0.5" y="0.5" width="1119" height="619" rx="18" fill="#F8FAFD" stroke="#DCE4F2"/>

  <!-- Brand emblem + title -->
  <g transform="translate(24,18)">
    <rect width="30" height="30" rx="8" fill="#0B0D12" stroke="#6895FF" stroke-opacity="0.55" stroke-width="1.2"/>
    <rect x="6.5" y="7" width="17" height="3.5" rx="1.2" fill="#6895FF"/>
    <path d="M7 14.5h16M7 18.8h12.5M7 23h8.8" stroke="#F2F4F8" stroke-width="1.9" stroke-linecap="round"/>
    <circle cx="21.5" cy="23" r="1.6" fill="#34D399"/>
  </g>
  <text x="64" y="39" font-size="18" font-weight="700" fill="#0F1420">AI Digest · Rust Binary &amp; TypeScript Editorial Architecture</text>
  <text x="1094" y="38" text-anchor="end" font-size="12" fill="#64748B">Single Rust binary · Level 5/5 GEO · Optional AES-256-GCM</text>

  <!-- Stage 1: Sources -->
  <rect x="22" y="66" width="194" height="346" rx="14" fill="#F1F5FB" stroke="#DCE4F2"/>
  <text x="119" y="92" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1E40AF">1 · Sources</text>

  <g filter="url(#sh)"><rect x="34" y="108" width="170" height="64" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="34" y="108" width="4.5" height="64" rx="2.2" fill="#2952CC"/></g>
  <text x="48" y="131" font-size="13" font-weight="650" fill="#0F1420">Open Feeds (~155)</text>
  <text x="48" y="148" font-size="11" fill="#4A5568">RSS · Atom · HTML · Blogs</text>
  <text x="48" y="163" font-size="10.5" fill="#64748B">Zero API keys required</text>

  <g filter="url(#sh)"><rect x="34" y="182" width="170" height="64" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="34" y="182" width="4.5" height="64" rx="2.2" fill="#3B82F6"/></g>
  <text x="48" y="205" font-size="13" font-weight="650" fill="#0F1420">Research &amp; Code</text>
  <text x="48" y="222" font-size="11" fill="#4A5568">arXiv (12 cats) · HF Daily</text>
  <text x="48" y="237" font-size="10.5" fill="#64748B">GitHub releases &amp; trending</text>

  <g filter="url(#sh)"><rect x="34" y="256" width="170" height="64" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="34" y="256" width="4.5" height="64" rx="2.2" fill="#6895FF"/></g>
  <text x="48" y="279" font-size="13" font-weight="650" fill="#0F1420">Communities &amp; Media</text>
  <text x="48" y="296" font-size="11" fill="#4A5568">HN · Reddit · Lobsters</text>
  <text x="48" y="311" font-size="10.5" fill="#64748B">Podcasts · YouTube · Policy</text>

