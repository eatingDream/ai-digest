  <text x="1006" y="92" text-anchor="middle" font-size="13.5" font-weight="700" fill="#9f4222">5 · Deploy &amp; Verify</text>

  <g filter="url(#sh)"><rect x="926" y="108" width="160" height="106" rx="10" fill="#fffdf9" stroke="#e5ddd0"/><rect x="926" y="108" width="4.5" height="106" rx="2.2" fill="#d97706"/></g>
  <text x="940" y="131" font-size="13" font-weight="650" fill="#1f1c18">Cloudflare Pages</text>
  <text x="940" y="149" font-size="11" fill="#645b51">Global edge static CDN</text>
  <text x="940" y="165" font-size="11" fill="#645b51">HSTS · COOP · CORP</text>
  <text x="940" y="181" font-size="11" fill="#645b51">no-store on latest/index</text>
  <text x="940" y="198" font-size="10.5" fill="#8b7e72">Zero origin servers</text>

