  <text x="708" y="149" font-size="11" fill="#645b51">Embedded TS/CSS editorial UI</text>
  <text x="708" y="165" font-size="11" fill="#645b51">52px mast · Accordion TOC</text>
  <text x="708" y="181" font-size="11" fill="#645b51">Inline math · Collapsible filter</text>
  <text x="708" y="195" font-size="10.5" fill="#8b7e72">Single-file HTML + /favicon.svg</text>

