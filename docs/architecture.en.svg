  <text x="488" y="131" font-size="13" font-weight="650" fill="#1f1c18">Primary-Source Check</text>
  <text x="488" y="149" font-size="11" fill="#645b51">prompts/&lt;lang&gt;/*.md</text>
  <text x="488" y="165" font-size="11" fill="#645b51">ai-digest page (SSRF-safe)</text>
  <text x="488" y="181" font-size="10.5" fill="#8b7e72">filter-notes.md editorial bar</text>

  <g filter="url(#sh)"><rect x="474" y="208" width="170" height="86" rx="10" fill="#fffdf9" stroke="#e5ddd0"/><rect x="474" y="208" width="4.5" height="86" rx="2.2" fill="#c96b3b"/></g>
  <text x="488" y="231" font-size="13" font-weight="650" fill="#1f1c18">7 Editorial Sections</text>
  <text x="488" y="249" font-size="11" fill="#645b51">Models · Papers · Tools</text>
  <text x="488" y="265" font-size="11" fill="#645b51">Industry · Compute · Safety</text>
  <text x="488" y="281" font-size="10.5" fill="#8b7e72">Opinions · Zero clickbait</text>

  <g filter="url(#sh)"><rect x="474" y="308" width="170" height="90" rx="10" fill="#fffdf9" stroke="#e5ddd0"/><rect x="474" y="308" width="4.5" height="90" rx="2.2" fill="#4f6d5a"/></g>
  <text x="488" y="331" font-size="13" font-weight="650" fill="#1f1c18">Bilingual Markdown</text>
  <text x="488" y="349" font-size="11" fill="#645b51">digest-&lt;P&gt;.md</text>
  <text x="488" y="365" font-size="11" fill="#645b51">+ optional digest-&lt;P&gt;.en.md</text>
  <text x="488" y="381" font-size="10.5" fill="#8b7e72">Auto-paired at publish time</text>

  <!-- Stage 4: Render & Security -->
  <rect x="682" y="66" width="206" height="346" rx="14" fill="#f2efe9" stroke="#ded4c5"/>
  <text x="785" y="92" text-anchor="middle" font-size="13.5" font-weight="700" fill="#874826">4 · Render &amp; Harden</text>

  <g filter="url(#sh)"><rect x="694" y="108" width="182" height="92" rx="10" fill="#fffdf9" stroke="#e5ddd0"/><rect x="694" y="108" width="4.5" height="92" rx="2.2" fill="#b85432"/></g>
