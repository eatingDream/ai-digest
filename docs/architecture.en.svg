  <text x="488" y="131" font-size="13" font-weight="650" fill="#0F1420">Primary-Source Check</text>
  <text x="488" y="149" font-size="11" fill="#4A5568">prompts/&lt;lang&gt;/*.md</text>
  <text x="488" y="165" font-size="11" fill="#4A5568">ai-digest page (SSRF-safe)</text>
  <text x="488" y="181" font-size="10.5" fill="#64748B">filter-notes.md editorial bar</text>

  <g filter="url(#sh)"><rect x="474" y="208" width="170" height="86" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="474" y="208" width="4.5" height="86" rx="2.2" fill="#3B82F6"/></g>
  <text x="488" y="231" font-size="13" font-weight="650" fill="#0F1420">7 Editorial Sections</text>
  <text x="488" y="249" font-size="11" fill="#4A5568">Models · Papers · Tools</text>
  <text x="488" y="265" font-size="11" fill="#4A5568">Industry · Compute · Safety</text>
  <text x="488" y="281" font-size="10.5" fill="#64748B">Opinions · Zero clickbait</text>

  <g filter="url(#sh)"><rect x="474" y="308" width="170" height="90" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="474" y="308" width="4.5" height="90" rx="2.2" fill="#10B981"/></g>
  <text x="488" y="331" font-size="13" font-weight="650" fill="#0F1420">Bilingual Markdown</text>
  <text x="488" y="349" font-size="11" fill="#4A5568">digest-&lt;P&gt;.md</text>
  <text x="488" y="365" font-size="11" fill="#4A5568">+ optional digest-&lt;P&gt;.en.md</text>
  <text x="488" y="381" font-size="10.5" fill="#64748B">Auto-paired at publish time</text>

