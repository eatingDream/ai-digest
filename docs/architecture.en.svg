  <text x="940" y="269" font-size="11" fill="#645b51">ai-digest verify &amp; WebCrypto</text>
  <text x="940" y="285" font-size="11" fill="#645b51">Public exact-match or</text>
  <text x="940" y="299" font-size="10.5" fill="#8b7e72">AES-GCM decryption parity</text>

