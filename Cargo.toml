[package]
name = "ai-digest"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "AI news recall, static digest rendering, GEO generation, and encrypted publishing"
repository = "https://github.com/eatingDream/ai-digest"

[dependencies]
clap = { version = "~4.5", features = ["derive", "wrap_help"] }
anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "time", "sync", "net", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "gzip", "deflate", "brotli", "charset", "json", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
html5gum = "0.6"
quick-xml = { version = "0.37", features = ["encoding"] }
url = "2.5"
percent-encoding = "2.3"
regex = "1.11"
sha2 = "0.11"
sha1 = "0.11"
hmac = "0.13"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
aes-gcm = "0.11"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
base64 = "0.23"
hex = "0.4"
rand = "0.8"
fs2 = "0.4"
tempfile = "3.15"

[dev-dependencies]
syn = { version = "3.0", features = ["full", "visit"] }
wiremock = "=0.6.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.pbkdf2]
opt-level = 3
